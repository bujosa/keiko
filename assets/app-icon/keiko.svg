<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Keiko: a knotted training belt on a vermilion seal. Original work, MIT OR Apache-2.0. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2654F"/>
      <stop offset="1" stop-color="#C7392A"/>
    </linearGradient>
    <linearGradient id="belt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFBF2"/>
      <stop offset="1" stop-color="#EDE4D2"/>
    </linearGradient>
    <linearGradient id="tailL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCD1BB"/>
      <stop offset="1" stop-color="#F6F0E3"/>
    </linearGradient>
    <linearGradient id="tailR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ECE4D3"/>
      <stop offset="1" stop-color="#FFFBF2"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <g clip-path="url(#clip)">
    <rect x="100" y="100" width="824" height="330" fill="url(#gloss)"/>
    <rect x="100" y="420" width="824" height="104" fill="url(#belt)"/>
    <rect x="100" y="512" width="824" height="12" fill="#B83224" opacity="0.18"/>
    <path d="M484 508 L366 818 Q361 832 375 837 L443 857 Q456 861 461 847 L550 540 Z" fill="url(#tailL)"/>
    <path d="M540 508 L658 818 Q663 832 649 837 L581 857 Q568 861 563 847 L474 540 Z" fill="url(#tailR)"/>
    <rect x="432" y="380" width="160" height="182" rx="32" fill="#FFFBF2" stroke="#A92D20" stroke-width="14"/>
    <path d="M464 434 Q512 458 560 434" fill="none" stroke="#D8CBB0" stroke-width="11" stroke-linecap="round"/>
    <path d="M464 508 Q512 484 560 508" fill="none" stroke="#D8CBB0" stroke-width="11" stroke-linecap="round"/>
  </g>
</svg>
