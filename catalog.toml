# The Keiko catalog: every dojo the launcher can install, update and open.
#
# Keiko reads each app's latest GitHub release, picks the asset named by `asset` for this Mac and
# installs it only if its SHA-256 matches the release's `SHA256SUMS.txt` and the bundle inside
# carries `mac_bundle_id`. Adding a dojo is a pull request to this file (see docs/adding-a-dojo.md).

[[apps]]
id = "poddojo"
name = "PodDojo"
tagline = "Docker and the CKAD, hands-on"
description = "Real labs that grade themselves, timed CKAD mock exams and a spaced review deck, on your own machines."
repo = "bujosa/poddojo"
mac_bundle_name = "PodDojo"
mac_bundle_id = "dev.bujosa.poddojo"
# {version} is the release version without the leading v; {arch} is arm64 or x86_64.
asset = "PodDojo-v{version}-macos-{arch}.zip"
checksums = "SHA256SUMS.txt"
color = [45, 212, 191]


# Keiko itself: checked like any dojo and updated in place ("Update and restart").
[launcher]
id = "keiko"
name = "Keiko"
tagline = "The launcher for the dojo apps"
description = "Install, update and open the dojos."
repo = "bujosa/keiko"
mac_bundle_name = "Keiko"
mac_bundle_id = "dev.bujosa.keiko"
asset = "Keiko-v{version}-macos-{arch}.zip"
checksums = "SHA256SUMS.txt"
color = [235, 82, 66]
