<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Keiko: a knotted training belt on sumi ink, with a vermilion hanko seal. Original work, MIT OR Apache-2.0. -->
